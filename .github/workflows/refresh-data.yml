name: Refresh data

# Rebuilds public/data from the live sources and commits the result when something changed.
# A commit to the default branch triggers a redeploy on the host.
on:
  schedule:
    - cron: '17 11 * * 0'           # Sunday morning (US Eastern): after Saturday's college games
    - cron: '17 11 * * 3'           # Wednesday morning: after the week's new rankings and NFL results
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Background text and recruiting classes change rarely, so keep the day's source cache between runs.
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: pipeline-cache-${{ steps.day.outputs.day }}-${{ github.run_id }}
          restore-keys: pipeline-cache-${{ steps.day.outputs.day }}-
      - run: npm run data
      - run: npm run data:check
      - name: Commit when the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh data ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git push
          fi
